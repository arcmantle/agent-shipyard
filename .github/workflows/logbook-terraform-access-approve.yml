name: Approve General Terraform Access

on:
  workflow_dispatch:
    inputs:
      bootstrap_request:
        description: Private subscription Terraform access request
        required: true
        type: string

permissions:
  contents: read

jobs:
  review:
    if: github.repository == 'arcmantle/agent-shipyard' && github.ref == 'refs/heads/main' && github.actor == format('{0}[bot]', vars.INFRA_APP_SLUG)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      digest: ${{ steps.review.outputs.digest }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: arcmantle
          repositories: agent-shipyard-infra
          permission-actions: read
      - name: Verify the private access request
        id: review
        uses: actions/github-script@v8
        env:
          BOOTSTRAP_REQUEST: ${{ inputs.bootstrap_request }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const { createHash } = require('node:crypto');
            const encoded = process.env.BOOTSTRAP_REQUEST;
            if (!encoded || encoded.length > 4096) throw new Error('Invalid access request');
            const bytes = Buffer.from(encoded, 'base64');
            const request = JSON.parse(bytes);
            if (Object.keys(request).sort().join(',') !== 'infra_sha,request_run_attempt,request_run_id,target_sha256'
              || !/^[1-9][0-9]*$/.test(request.request_run_id) || !/^[1-9][0-9]*$/.test(request.request_run_attempt)
              || !/^[a-f0-9]{40}$/.test(request.infra_sha) || !/^[a-f0-9]{64}$/.test(request.target_sha256)) throw new Error('Invalid access request fields');
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: 'arcmantle', repo: 'agent-shipyard-infra', run_id: request.request_run_id,
            });
            const age = Date.now() - Date.parse(run.created_at);
            if (run.repository.full_name !== 'arcmantle/agent-shipyard-infra' || run.head_branch !== 'main'
              || run.path !== '.github/workflows/terraform-access.yml' || run.event !== 'workflow_dispatch'
              || run.actor.login.toLowerCase() !== 'roenlie' || run.triggering_actor.login.toLowerCase() !== 'roenlie'
              || run.head_sha !== request.infra_sha || String(run.id) !== request.request_run_id
              || String(run.run_attempt) !== request.request_run_attempt || !Number.isFinite(age) || age < 0 || age > 3600000
              || ['failure', 'cancelled', 'timed_out'].includes(run.conclusion)) throw new Error('The private access run does not match');
            core.setOutput('digest', createHash('sha256').update(bytes).digest('hex'));
            await core.summary.addHeading('General Terraform Access')
              .addRaw('Approval installs subscription Owner on the existing Terraform Apply identity and subscription Reader on Plan. Both also receive Blob Data Contributor on the existing tfstate container for approved automation maintenance and state locking. Existing application-state and firewall permissions remain. Owner is standing authority to manage resources, role assignments, custom roles, provider registration, and managed identity trust in the configured subscription. It can change its own access. Azure does not enforce GitHub approval; the protected workflow controls execution. Runtime and migration database grants are unchanged. The retired setup identity is not restored.\n\n')
              .addLink('Review the exact private subscription, identities, and source', `https://github.com/arcmantle/agent-shipyard-infra/actions/runs/${request.request_run_id}`)
              .addRaw('\n\nThis permission change requires one administrator sign-in in the private installation run. Complete it there after approval. Do not send codes through chat. The workflow consumes this operation before sign-in and removes its isolated login on exit. Later Terraform changes use OIDC and approval of the exact saved plan, without resource-type permission bootstraps. Microsoft Graph tenant administration is outside this grant.')
              .write();

  approve:
    name: Approve Subscription Owner For Terraform Apply
    needs: review
    environment: azure-production
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: arcmantle
          repositories: agent-shipyard-infra
          permission-actions: write
      - name: Authorize only the verified access installation
        uses: actions/github-script@v8
        env:
          BOOTSTRAP_REQUEST: ${{ inputs.bootstrap_request }}
          REQUEST_DIGEST: ${{ needs.review.outputs.digest }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const token = await core.getIDToken(`urn:arcmantle:shipyard:terraform-access:${process.env.REQUEST_DIGEST}`);
            core.setSecret(token);
            await github.rest.actions.createWorkflowDispatch({
              owner: 'arcmantle', repo: 'agent-shipyard-infra', workflow_id: 'terraform-access.yml', ref: 'main',
              inputs: { bootstrap_request: process.env.BOOTSTRAP_REQUEST, approval_token: token },
            });
