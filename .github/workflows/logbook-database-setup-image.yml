name: Build Database Setup Image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'arcmantle/agent-shipyard' && github.ref == 'refs/heads/main' && github.actor == 'roenlie' && github.triggering_actor == 'roenlie'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent_issues
          POSTGRES_PASSWORD: agent_issues_dev_only
          POSTGRES_DB: agent_issues
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U agent_issues -d agent_issues"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.10.0'
      - run: pnpm --dir logbook --filter @agent-issues/api-pg... install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir logbook --filter @agent-issues/core build
      - name: Verify database access contracts
        run: |
          pnpm --dir logbook --filter @agent-issues/api-pg typecheck
          pnpm --dir logbook --filter @agent-issues/api-pg exec vitest run src/db/roles.test.ts src/db/entra-roles.test.ts src/db/migration-runner.test.ts src/production.test.ts
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the reviewed source image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: logbook
          file: logbook/docker/api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/arcmantle/logbook-database-setup:source-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/arcmantle/agent-shipyard
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/arcmantle/logbook-database-setup
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
