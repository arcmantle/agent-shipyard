name: Issues Publish

on:
  pull_request:
    paths:
      - 'issues/**'
      - '.github/workflows/issues-publish.yml'
  push:
    branches:
      - '**'
    paths:
      - 'issues/**'
      - '.github/workflows/issues-publish.yml'

defaults:
  run:
    working-directory: issues

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      AGENT_ISSUES_TEST_PG_URL: ${{ matrix.postgres && 'postgres://agent_issues:agent_issues_dev_only@127.0.0.1:5433/agent_issues' || '' }}
      AGENT_ISSUES_TEST_PG_APP_URL: ${{ matrix.postgres && 'postgres://agent_issues_app:agent_issues_app_dev_only@127.0.0.1:5433/agent_issues' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-latest
            os: ubuntu-latest
            postgres: true
          - name: macos-latest
            os: macos-latest
            postgres: false
          - name: windows-latest
            os: windows-latest
            postgres: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          package_json_file: issues/package.json

      - name: Install dependencies.
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL.
        if: matrix.postgres
        run: |
          docker run --detach --name agent-issues-postgres \
            --env POSTGRES_USER=agent_issues \
            --env POSTGRES_PASSWORD=agent_issues_dev_only \
            --env POSTGRES_DB=agent_issues \
            --publish 5433:5432 \
            --health-cmd "pg_isready -U agent_issues -d agent_issues" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 10 \
            postgres:16-alpine
          for _retry in {1..30}; do
            health=$(docker inspect --format='{{.State.Health.Status}}' agent-issues-postgres)
            if test "$health" = "healthy"; then
              exit 0
            fi
            if test "$health" = "unhealthy"; then
              docker logs agent-issues-postgres
              exit 1
            fi
            sleep 1
          done
          docker logs agent-issues-postgres
          exit 1

      - name: Initialize PostgreSQL application role.
        if: matrix.postgres
        run: >-
          docker run --rm --network host
          --volume "$PWD/docker/postgres-init:/docker-entrypoint-initdb.d:ro"
          postgres:16-alpine
          psql "$AGENT_ISSUES_TEST_PG_URL"
          --set ON_ERROR_STOP=1
          --file /docker-entrypoint-initdb.d/01-app-role.sql

      - name: Typecheck project.
        run: pnpm typecheck

      - name: Build project.
        run: pnpm build

      - name: Test project.
        if: matrix.postgres
        run: pnpm --workspace-concurrency=1 -r test

      - name: Test CLI.
        if: ${{ !matrix.postgres }}
        run: pnpm --filter agent-issues test

      - name: Test MCP server.
        if: ${{ !matrix.postgres }}
        run: pnpm --filter agent-issues-mcp test

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          package_json_file: issues/package.json

      - name: Install dependencies.
        run: pnpm install --frozen-lockfile

      - name: Calculate version with Prospector
        id: version
        uses: arcmantle/prospector@main
        with:
          dir: 'issues'

      - name: Set CLI package version
        run: |
          echo "Setting packages/cli version to ${{ steps.version.outputs.version }}"
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version --prefix packages/cli

      - name: Build project.
        run: pnpm build

      - name: Verify package versions
        run: |
          cli_version=$(node -p "require('./packages/cli/package.json').version")
          test "$cli_version" = "${{ steps.version.outputs.version }}"

      - name: Publish MCP package to NPM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          version=$(node -p "require('./packages/mcp-server/package.json').version")
          if ! npm view "agent-issues-mcp@$version" version >/dev/null 2>&1; then
            pnpm --dir packages/mcp-server publish --access public --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH }}
          NPM_TOKEN: ${{ secrets.NPM_PUBLISH }}

      - name: Publish CLI package to NPM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if ! npm view "agent-issues@$version" version >/dev/null 2>&1; then
            pnpm --dir packages/cli publish --access public --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH }}
          NPM_TOKEN: ${{ secrets.NPM_PUBLISH }}

  publish-plugin:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          package_json_file: issues/package.json

      - name: Install dependencies.
        run: pnpm install --frozen-lockfile

      - name: Calculate version with Prospector
        id: version
        uses: arcmantle/prospector@main
        with:
          dir: 'issues'

      - name: Set CLI package version
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version --prefix packages/cli

      - name: Build plugin.
        run: pnpm build

      - name: Checkout plugin distribution
        uses: actions/checkout@v4
        with:
          repository: arcmantle/agent-issues-plugin
          token: ${{ secrets.AGENT_ISSUES_PLUGIN_REPOSITORY_TOKEN }}
          path: plugin-distribution

      - name: Publish plugin distribution
        run: |
          set -euo pipefail
          test -f packages/cli/dist/plugin/plugin.json
          test -f packages/cli/dist/plugin/mcp.json
          test -f packages/cli/dist/plugin/com.github.copilot/agents/agent-issues.agent.md
          test -d packages/cli/dist/plugin/skills
          plugin_repository="$GITHUB_WORKSPACE/plugin-distribution"
          find "$plugin_repository" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R packages/cli/dist/plugin/. "$plugin_repository/"
          test -f "$plugin_repository/plugin.json"
          test -f "$plugin_repository/mcp.json"
          test -f "$plugin_repository/README.md"
          test -f "$plugin_repository/com.github.copilot/agents/agent-issues.agent.md"
          test -d "$plugin_repository/skills"
          git -C "$plugin_repository" add --all
          if git -C "$plugin_repository" diff --cached --quiet; then
            echo "Plugin distribution is already current."
            exit 0
          fi
          git -C "$plugin_repository" config user.name "github-actions[bot]"
          git -C "$plugin_repository" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$plugin_repository" commit -m "Update plugin from $GITHUB_SHA"
          git -C "$plugin_repository" push origin HEAD:main
