name: Approve One-Time Azure Setup

on:
  workflow_dispatch:
    inputs:
      bootstrap_request:
        description: Private setup request
        required: true
        type: string

permissions:
  contents: read

jobs:
  review:
    if: github.repository == 'arcmantle/agent-shipyard' && github.ref == 'refs/heads/main' && github.actor == format('{0}[bot]', vars.INFRA_APP_SLUG)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      digest: ${{ steps.review.outputs.digest }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: arcmantle
          repositories: agent-shipyard-infra
          permission-actions: read
      - name: Verify the private setup request
        id: review
        uses: actions/github-script@v8
        env:
          BOOTSTRAP_REQUEST: ${{ inputs.bootstrap_request }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const { createHash } = require('node:crypto');
            const encoded = process.env.BOOTSTRAP_REQUEST;
            if (!encoded || encoded.length > 4096) throw new Error('Invalid setup request');
            const bytes = Buffer.from(encoded, 'base64');
            const request = JSON.parse(bytes);
            if (Object.keys(request).sort().join(',') !== 'infra_sha,request_run_attempt,request_run_id'
              || !/^[1-9][0-9]*$/.test(request.request_run_id) || !/^[1-9][0-9]*$/.test(request.request_run_attempt)
              || !/^[a-f0-9]{40}$/.test(request.infra_sha)) throw new Error('Invalid setup request fields');
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: 'arcmantle', repo: 'agent-shipyard-infra', run_id: request.request_run_id,
            });
            const age = Date.now() - Date.parse(run.created_at);
            if (run.repository.full_name !== 'arcmantle/agent-shipyard-infra' || run.head_branch !== 'main'
              || run.path !== '.github/workflows/bootstrap.yml' || run.event !== 'workflow_dispatch'
              || run.actor.login.toLowerCase() !== 'roenlie' || run.triggering_actor.login.toLowerCase() !== 'roenlie'
              || run.head_sha !== request.infra_sha || String(run.id) !== request.request_run_id
              || String(run.run_attempt) !== request.request_run_attempt || !Number.isFinite(age) || age < 0 || age > 3600000
              || ['failure', 'cancelled', 'timed_out'].includes(run.conclusion)) throw new Error('The private setup run does not match');
            core.setOutput('digest', createHash('sha256').update(bytes).digest('hex'));
            await core.summary.addHeading('Approve One-Time Azure Setup')
              .addRaw('This approval permits Microsoft device-code sign-in in the private workflow, registration of the Managed Identity provider, creation of a dedicated setup identity and resource group, and a temporary subscription Owner role for that identity. Only the private setup workflow on main will be trusted. It does not create state storage, application hosting, or PostgreSQL.\n\n')
              .addLink('Review the Azure target and source in the private request', `https://github.com/arcmantle/agent-shipyard-infra/actions/runs/${request.request_run_id}`)
              .addRaw('\n\nAfter approval, open the new private setup run and complete Microsoft sign-in there. The one-time workflow disables itself before sign-in. Remove the setup identity privileges after the approved infrastructure setup is complete.')
              .write();

  approve:
    name: Approve One-Time Azure Identity
    needs: review
    environment: azure-production
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: arcmantle
          repositories: agent-shipyard-infra
          permission-actions: write
      - name: Authorize the private one-time action
        uses: actions/github-script@v8
        env:
          BOOTSTRAP_REQUEST: ${{ inputs.bootstrap_request }}
          REQUEST_DIGEST: ${{ needs.review.outputs.digest }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const token = await core.getIDToken(`urn:arcmantle:shipyard:bootstrap:${process.env.REQUEST_DIGEST}`);
            core.setSecret(token);
            await github.rest.actions.createWorkflowDispatch({
              owner: 'arcmantle', repo: 'agent-shipyard-infra', workflow_id: 'bootstrap.yml', ref: 'main',
              inputs: { bootstrap_request: process.env.BOOTSTRAP_REQUEST, approval_token: token },
            });
            await core.summary.addRaw('The approved request was sent to the private one-time setup action. Open that private action to complete Microsoft device-code sign-in. No Azure credentials or sign-in codes are shown here.').write();
