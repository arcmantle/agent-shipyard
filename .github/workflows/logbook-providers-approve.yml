name: Approve Application Provider Registration

on:
  workflow_dispatch:
    inputs:
      bootstrap_request:
        description: Private provider registration request
        required: true
        type: string

permissions:
  contents: read

jobs:
  review:
    if: github.repository == 'arcmantle/agent-shipyard' && github.ref == 'refs/heads/main' && github.actor == format('{0}[bot]', vars.INFRA_APP_SLUG)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      digest: ${{ steps.review.outputs.digest }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: arcmantle
          repositories: agent-shipyard-infra
          permission-actions: read
      - name: Verify the private provider request
        id: review
        uses: actions/github-script@v8
        env:
          BOOTSTRAP_REQUEST: ${{ inputs.bootstrap_request }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const { createHash } = require('node:crypto');
            const encoded = process.env.BOOTSTRAP_REQUEST;
            if (!encoded || encoded.length > 4096) throw new Error('Invalid provider request');
            const bytes = Buffer.from(encoded, 'base64');
            const request = JSON.parse(bytes);
            if (Object.keys(request).sort().join(',') !== 'infra_sha,request_run_attempt,request_run_id,target_sha256'
              || !/^[1-9][0-9]*$/.test(request.request_run_id) || !/^[1-9][0-9]*$/.test(request.request_run_attempt)
              || !/^[a-f0-9]{40}$/.test(request.infra_sha) || !/^[a-f0-9]{64}$/.test(request.target_sha256)) throw new Error('Invalid provider request fields');
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: 'arcmantle', repo: 'agent-shipyard-infra', run_id: request.request_run_id,
            });
            const age = Date.now() - Date.parse(run.created_at);
            if (run.repository.full_name !== 'arcmantle/agent-shipyard-infra' || run.head_branch !== 'main'
              || run.path !== '.github/workflows/providers.yml' || run.event !== 'workflow_dispatch'
              || run.actor.login.toLowerCase() !== 'roenlie' || run.triggering_actor.login.toLowerCase() !== 'roenlie'
              || run.head_sha !== request.infra_sha || String(run.id) !== request.request_run_id
              || String(run.run_attempt) !== request.request_run_attempt || !Number.isFinite(age) || age < 0 || age > 3600000
              || ['failure', 'cancelled', 'timed_out'].includes(run.conclusion)) throw new Error('The private provider run does not match');
            core.setOutput('digest', createHash('sha256').update(bytes).digest('hex'));
            await core.summary.addHeading('Register Application Azure Providers')
              .addRaw('This approval permits administrator device-code sign-in in the private Action and registration of Microsoft.Network, Microsoft.App, and Microsoft.DBforPostgreSQL in the verified private subscription. It creates no identity, federation, role assignment, hosting, database, or Terraform resources. It does not restore setup Owner access.\n\n')
              .addLink('Review the private source request', `https://github.com/arcmantle/agent-shipyard-infra/actions/runs/${request.request_run_id}`)
              .addRaw('\n\nAfter approval, complete Microsoft sign-in in the new private registration run. Do not send sign-in codes through chat. The operation disables itself before sign-in and removes its isolated login on exit. Resource deployment needs a separate saved-plan approval.')
              .write();

  approve:
    name: Approve Required Azure Provider Registration
    needs: review
    environment: azure-production
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: arcmantle
          repositories: agent-shipyard-infra
          permission-actions: write
      - name: Authorize only private provider registration
        uses: actions/github-script@v8
        env:
          BOOTSTRAP_REQUEST: ${{ inputs.bootstrap_request }}
          REQUEST_DIGEST: ${{ needs.review.outputs.digest }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const token = await core.getIDToken(`urn:arcmantle:shipyard:providers:${process.env.REQUEST_DIGEST}`);
            core.setSecret(token);
            await github.rest.actions.createWorkflowDispatch({
              owner: 'arcmantle', repo: 'agent-shipyard-infra', workflow_id: 'providers.yml', ref: 'main',
              inputs: { bootstrap_request: process.env.BOOTSTRAP_REQUEST, approval_token: token },
            });
