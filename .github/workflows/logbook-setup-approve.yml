name: Terraform - Approve Initial Setup

on:
  workflow_dispatch:
    inputs:
      purpose:
        description: Initial setup operation
        required: true
        type: choice
        options: [bootstrap, setup, recovery, retirement]
      review:
        description: Private initial setup request
        required: true
        type: string

permissions:
  contents: read

jobs:
  review:
    if: github.repository == 'arcmantle/agent-shipyard' && github.ref == 'refs/heads/main' && github.actor == format('{0}[bot]', vars.INFRA_APP_SLUG)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      digest: ${{ steps.review.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: arcmantle
          repositories: agent-shipyard-infra
          permission-actions: read
      - name: Verify the successful private setup plan
        id: review
        uses: actions/github-script@v8
        env:
          REVIEW: ${{ inputs.review }}
          PURPOSE: ${{ inputs.purpose }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const { reviewSetup } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/initial-setup.mjs`);
            const result = await reviewSetup(process.env.PURPOSE, process.env.REVIEW, github);
            core.setOutput('digest', result.digest);
            await core.summary.addHeading(result.heading)
              .addLink('Review the exact private request and Azure target', `https://github.com/arcmantle/agent-shipyard-infra/actions/runs/${result.runId}`)
              .addRaw(`\n\n${result.details}`)
              .write();

  approve:
    name: Approve Initial Setup Operation
    needs: review
    environment: azure-production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: arcmantle
          repositories: agent-shipyard-infra
          permission-actions: write
      - name: Authorize the exact private setup plan
        uses: actions/github-script@v8
        env:
          REVIEW: ${{ inputs.review }}
          REVIEW_DIGEST: ${{ needs.review.outputs.digest }}
          PURPOSE: ${{ inputs.purpose }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const { setupCallback } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/initial-setup.mjs`);
            const inputs = setupCallback(process.env.PURPOSE, process.env.REVIEW, process.env.REVIEW_DIGEST);
            const token = await core.getIDToken(`urn:arcmantle:shipyard:${process.env.PURPOSE}:${process.env.REVIEW_DIGEST}`);
            core.setSecret(token);
            await github.rest.actions.createWorkflowDispatch({
              owner: 'arcmantle', repo: 'agent-shipyard-infra', workflow_id: 'setup.yml', ref: 'main',
              inputs: { ...inputs, approval_token: token },
            });
            await core.summary.addRaw('The approved saved plan was sent to private Setup Azure Infrastructure. Check that private run for the Azure result.').write();
