name: Terraform - Validate

on:
  pull_request:
    paths:
      - 'logbook/infra/**'
      - '.github/workflows/logbook-infra-*.yml'
      - '.github/workflows/logbook-setup-approve.yml'
      - '.github/scripts/initial-setup*'
  push:
    branches: [main]
    paths:
      - 'logbook/infra/**'
      - '.github/workflows/logbook-infra-*.yml'
      - '.github/workflows/logbook-setup-approve.yml'
      - '.github/scripts/initial-setup*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.5'
          terraform_wrapper: false
      - name: Verify initial setup approval
        run: node --test .github/scripts/initial-setup.test.mjs
      - name: Check formatting
        run: terraform -chdir=logbook/infra/terraform fmt -check -recursive
      - name: Validate Terraform roots
        shell: bash
        run: |
          set -euo pipefail
          for root in bootstrap examples/logbook-backend modules/logbook-backend; do
            terraform -chdir="logbook/infra/terraform/$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="logbook/infra/terraform/$root" validate
          done
      - name: Test the Logbook backend module
        run: terraform -chdir=logbook/infra/terraform/modules/logbook-backend test
