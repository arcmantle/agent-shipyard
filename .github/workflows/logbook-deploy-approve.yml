name: Approve Logbook Deployment

on:
  workflow_dispatch:
    inputs:
      review:
        description: Private plan review envelope
        required: true
        type: string

permissions:
  contents: read

jobs:
  review:
    if: github.repository == 'arcmantle/agent-shipyard' && github.ref == 'refs/heads/main' && github.actor == format('{0}[bot]', vars.INFRA_APP_SLUG)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      has_changes: ${{ steps.review.outputs.has_changes }}
      digest: ${{ steps.review.outputs.digest }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: arcmantle
          repositories: agent-shipyard-infra
          permission-actions: read
      - name: Verify private plan and show safe summary
        id: review
        uses: actions/github-script@v8
        env:
          REVIEW: ${{ inputs.review }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const { createHash } = require('node:crypto');
            if (process.env.REVIEW.length > 8192) throw new Error('Invalid review size');
            const bytes = Buffer.from(process.env.REVIEW, 'base64');
            const review = JSON.parse(bytes);
            const fields = ['request_run_id', 'request_run_attempt', 'source_sha', 'plan_run_id', 'plan_run_attempt', 'infra_sha', 'plan_sha256', 'monthly_usd', 'counts', 'has_changes', 'created_at'];
            if (Object.keys(review).some(field => !fields.includes(field))) throw new Error('Unexpected review field');
            for (const field of ['request_run_id', 'request_run_attempt', 'plan_run_id', 'plan_run_attempt']) {
              if (!/^[1-9][0-9]*$/.test(review[field])) throw new Error('Invalid run ID');
            }
            if (!/^[a-f0-9]{64}$/.test(review.plan_sha256) || !/^[a-f0-9]{40}$/.test(review.infra_sha)
              || !/^[a-f0-9]{40}$/.test(review.source_sha) || typeof review.has_changes !== 'boolean'
              || !Number.isFinite(review.monthly_usd) || review.monthly_usd < 0
              || !Number.isFinite(Date.parse(review.created_at)) || Date.parse(review.created_at) > Date.now()
              || Date.now() - Date.parse(review.created_at) > 86400000) throw new Error('Invalid or expired review');
            if (Object.keys(review.counts).sort().join(',') !== 'create,delete,update'
              || !Object.values(review.counts).every(value => Number.isSafeInteger(value) && value >= 0)) throw new Error('Invalid action counts');
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner: 'arcmantle', repo: 'agent-shipyard-infra', run_id: review.plan_run_id });
            if (run.conclusion !== 'success' || run.event !== 'workflow_dispatch' || run.head_branch !== 'main'
              || run.path !== '.github/workflows/plan.yml' || run.head_sha !== review.infra_sha
              || String(run.run_attempt) !== review.plan_run_attempt) throw new Error('The private plan run does not match');
            core.setOutput('digest', createHash('sha256').update(bytes).digest('hex'));
            core.setOutput('has_changes', String(review.has_changes));
            await core.summary.addHeading('Logbook Deployment Review')
              .addTable([['Create', 'Update', 'Delete'], [String(review.counts.create), String(review.counts.update), String(review.counts.delete)]])
              .addRaw(`Estimated application resources: USD ${review.monthly_usd.toFixed(2)}/month. These are manually reviewed estimates, not a billing cap. State storage, automation, tax, and additional usage are extra.`)
              .addLink('Review the full private plan before approval', `https://github.com/arcmantle/agent-shipyard-infra/actions/runs/${review.plan_run_id}`)
              .addRaw(`\nPlan SHA-256: ${review.plan_sha256}\nSource commit: ${review.source_sha}\n`)
              .addRaw(review.has_changes ? 'Approval authorizes this saved plan only.' : 'No changes. Apply will not run.')
              .write();

  approve:
    name: Approve Saved Plan
    needs: review
    if: needs.review.outputs.has_changes == 'true'
    environment: azure-production
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: arcmantle
          repositories: agent-shipyard-infra
          permission-actions: write
      - name: Authorize private apply
        uses: actions/github-script@v8
        env:
          REVIEW: ${{ inputs.review }}
          REVIEW_DIGEST: ${{ needs.review.outputs.digest }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const token = await core.getIDToken(`urn:arcmantle:shipyard:apply:${process.env.REVIEW_DIGEST}`);
            core.setSecret(token);
            await github.rest.actions.createWorkflowDispatch({
              owner: 'arcmantle', repo: 'agent-shipyard-infra', workflow_id: 'apply.yml', ref: 'main',
              inputs: { review: process.env.REVIEW, approval_token: token },
            });
            await core.summary.addRaw('The approved plan was sent to the private Apply workflow. Check that workflow for the deployment result.').write();
