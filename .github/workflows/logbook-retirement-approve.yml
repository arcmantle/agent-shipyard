name: Approve Temporary Azure Setup Access Removal

on:
  workflow_dispatch:
    inputs:
      review:
        description: Exact private setup access removal request
        required: true
        type: string

permissions:
  contents: read

jobs:
  review:
    if: github.repository == 'arcmantle/agent-shipyard' && github.ref == 'refs/heads/main' && github.actor == format('{0}[bot]', vars.INFRA_APP_SLUG)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      digest: ${{ steps.review.outputs.digest }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: arcmantle
          repositories: agent-shipyard-infra
          permission-actions: read
      - name: Verify the private setup access removal request
        id: review
        uses: actions/github-script@v8
        env:
          REVIEW: ${{ inputs.review }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const { createHash } = require('node:crypto');
            const encoded = process.env.REVIEW;
            if (!encoded || encoded.length > 8192) throw new Error('Invalid retirement review');
            const bytes = Buffer.from(encoded, 'base64');
            const review = JSON.parse(bytes);
            const age = Date.now() - Date.parse(review.created_at);
            if (Object.keys(review).sort().join(',') !== 'created_at,infra_sha,request_run_attempt,request_run_id,setup_run_attempt,setup_run_id,target_sha256'
              || !['request_run_id', 'request_run_attempt', 'setup_run_id', 'setup_run_attempt'].every(key => /^[1-9][0-9]*$/.test(review[key]))
              || !/^[a-f0-9]{40}$/.test(review.infra_sha) || !/^[a-f0-9]{64}$/.test(review.target_sha256)
              || !Number.isFinite(age) || age < 0 || age > 86400000) throw new Error('Invalid retirement fields');
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: 'arcmantle', repo: 'agent-shipyard-infra', run_id: review.request_run_id,
            });
            if (run.repository.full_name !== 'arcmantle/agent-shipyard-infra' || run.head_branch !== 'main'
              || run.path !== '.github/workflows/setup.yml' || run.event !== 'workflow_dispatch'
              || run.display_title !== 'Setup Azure automation (request-retirement)'
              || run.actor.login.toLowerCase() !== 'roenlie' || run.triggering_actor.login.toLowerCase() !== 'roenlie'
              || run.head_sha !== review.infra_sha || String(run.id) !== review.request_run_id
              || String(run.run_attempt) !== review.request_run_attempt
              || ['failure', 'cancelled', 'timed_out'].includes(run.conclusion)) throw new Error('The retirement request does not match');
            core.setOutput('digest', createHash('sha256').update(bytes).digest('hex'));
            await core.summary.addHeading('Remove Temporary Setup Access')
              .addLink('Review exact private access records and successful setup', `https://github.com/arcmantle/agent-shipyard-infra/actions/runs/${review.request_run_id}`)
              .addRaw('\n\nApproval removes only the temporary setup identity federation and its exact subscription Owner assignment. The private callback rechecks the target and access records, verifies federation removal, and deletes the Owner assignment last. It does not run Terraform Apply, delete resources or state, modify routine identities, or enable deployment. If removal partially fails, stop and use separately approved administrator recovery. Do not rerun consumed approval. This request is single-use and expires after 24 hours.')
              .write();

  approve:
    name: Approve Setup Federation And Owner Removal
    needs: review
    environment: azure-production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: arcmantle
          repositories: agent-shipyard-infra
          permission-actions: write
      - name: Authorize only the exact setup access removal
        uses: actions/github-script@v8
        env:
          REVIEW: ${{ inputs.review }}
          REVIEW_DIGEST: ${{ needs.review.outputs.digest }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const token = await core.getIDToken(`urn:arcmantle:shipyard:retirement:${process.env.REVIEW_DIGEST}`);
            core.setSecret(token);
            await github.rest.actions.createWorkflowDispatch({
              owner: 'arcmantle', repo: 'agent-shipyard-infra', workflow_id: 'setup.yml', ref: 'main',
              inputs: { operation: 'retire', stage: 'automation', review: process.env.REVIEW, approval_token: token },
            });
            await core.summary.addRaw('The approved access removal was sent to private Actions. Check that run for the result. Deployment remains disabled.').write();
