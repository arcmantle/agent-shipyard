services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-issues-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent_issues
      POSTGRES_PASSWORD: agent_issues_dev_only
      POSTGRES_DB: agent_issues
    ports:
      - "5433:5432"
    volumes:
      - agent-issues-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: agent-issues-local-pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: agent_issues_admin@example.com
      PGADMIN_DEFAULT_PASSWORD: agent_issues_dev_only
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_LISTEN_PORT: "5050"
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGPASS_FILE: /pgadmin4/pgpass
    ports:
      - "8978:5050"
    volumes:
      - agent-issues-pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgadmin4/pgpass:ro

volumes:
  agent-issues-postgres-data:
  agent-issues-pgadmin-data:
